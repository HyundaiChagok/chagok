org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
kotlin.code.style=official
android.useAndroidX=true

# 차곡: 값의 출처. live(기본)는 Pleos SDK 값만 쓴다. scenario는 휘발유 시연 대본을 섞고 화면과 기록에 '시연 모드'를 표시한다.
chagok.demoMode=live
# 차곡: 데이터 QR이 여는 고객 리포트 웹 주소. web/은 scripts/publish-web.sh로 이 주소에 올린다.
chagok.reportBaseUrl=https://rosieoh.github.io/chagok-report
# 차곡: 공모전 제출 APK 이름의 팀명(./gradlew :app:contestApk). 한글은 -Pchagok.team=팀명으로 넘기는 편이 안전하다.
chagok.team=TEAM
