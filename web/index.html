<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>차곡 리포트</title>
<style>
/* 리포트 웹의 첫 주소. 기록은 r/ 아래에서 링크의 # 뒤 데이터로만 연다. 색은 r/index.html과 같다. */
:root{--paper:#F2F4F5;--ink:#14191C;--ink-2:#55616A;--signal-ink:#A4570F;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--paper:#121719;--ink:#E3E7E9;--ink-2:#9BA6AE;--signal-ink:#EFA35C;color-scheme:dark}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;line-height:1.6;word-break:keep-all}
main{max-width:40rem;margin:0 auto;padding:40px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.brand{font-weight:700;font-size:1.25rem;color:var(--signal-ink)}
h1{font-size:1.75rem;line-height:1.3;margin:24px 0 12px}
p{margin:0 0 12px;color:var(--ink-2)}
</style>
</head>
<body>
<main>
  <p class="brand">차곡</p>
  <h1>렌터카 인수·반납 기록</h1>
  <p>차량 화면의 QR을 휴대폰 카메라로 찍으면, 인수 기록이나 반납 리포트가 이 주소에서 열립니다.</p>
  <p>기록은 링크 안에만 담겨 있고 서버로 보내지지 않습니다.</p>
</main>
</body>
</html>
