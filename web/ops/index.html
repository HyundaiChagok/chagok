<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>차곡 반납 목록</title>
<style>
/*
  업체용 반납 목록. 서버 없이 휴대폰 한 대로 쓴다. 리포트 페이지(r/)가 넣은 기록 링크의 데이터를 이 휴대폰의 localStorage에만 두고,
  열 때마다 그 데이터를 다시 풀어 숫자를 만든다. 그래서 기록 자체가 유일한 근거이고, 외부 스크립트·글꼴·전송이 없다.
  색과 면은 r/index.html과 같다. 주황은 '확인 필요'에만, 초록은 완료에만 쓰고, 누르는 것은 잉크색으로 채운다.
*/
:root{
  --paper:#F2F4F5;--raised:#FFFFFF;--sunken:#E5E9EB;--rule:#D5DBDE;
  --ink:#14191C;--ink-2:#55616A;--ink-3:#8B969D;
  --signal:#EC9846;--on-signal:#1C1206;--signal-ink:#A4570F;--signal-soft:#FCEAD6;
  --good:#1E7A4C;--good-soft:#DCF0E4;--bad:#B3261E;--bad-soft:#F9DEDC;
  --shadow:0 6px 24px rgba(0,0,0,.08);
  --sans:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121719;--raised:#1B2225;--sunken:#20292D;--rule:#2C353B;
    --ink:#E3E7E9;--ink-2:#9BA6AE;--ink-3:#66727A;
    --signal-ink:#EFA35C;--signal-soft:#3A2919;--good:#74CFA0;--good-soft:#173226;--bad:#F2B8B5;--bad-soft:#3D2020;
    --shadow:0 6px 24px rgba(0,0,0,.4);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121719;--raised:#1B2225;--sunken:#20292D;--rule:#2C353B;
  --ink:#E3E7E9;--ink-2:#9BA6AE;--ink-3:#66727A;
  --signal-ink:#EFA35C;--signal-soft:#3A2919;--good:#74CFA0;--good-soft:#173226;--bad:#F2B8B5;--bad-soft:#3D2020;
  --shadow:0 6px 24px rgba(0,0,0,.4);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
::selection{background:var(--rule);color:var(--ink)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
main{max-width:40rem;margin:0 auto;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.num{font-variant-numeric:tabular-nums}
.ic{width:24px;height:24px;flex:none;fill:currentColor}

.top{display:flex;align-items:center;gap:8px;min-height:44px}
.brand{font-weight:700;font-size:1.125rem;letter-spacing:.02em}
.doc{color:var(--ink-2);font-size:.9375rem}
#mark{margin-left:auto}
.tag{display:inline-flex;align-items:center;font-size:.8125rem;font-weight:600;line-height:1;padding:7px 10px;border-radius:8px;background:var(--sunken);color:var(--ink-2)}
/* 예시는 실제 기록과 면부터 달라야 한다. 채우지 않고 점선으로 두른다. */
.tag.sample{background:transparent;color:var(--ink);padding:6px 9px;border:1.5px dashed var(--ink-2)}

/* 요약. r/과 같이 제목 자체가 답이다. */
h1{font-size:1.625rem;line-height:1.35;font-weight:500;letter-spacing:-.01em;margin:10px 0 0;color:var(--ink-2)}
h1 .l{display:block;text-wrap:balance}
h1 b{font-weight:700;color:var(--ink)}
h1 .warn,h1 .warn b{color:var(--signal-ink)}
.basis{margin:6px 0 0;color:var(--ink);font-size:.9375rem;font-weight:600;line-height:1.5}
.status{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px;font-size:.9375rem;line-height:1.5}
.status li{display:flex;gap:8px;color:var(--ink-2)}
.status .ic{width:20px;height:20px;margin-top:1px}
.status b{font-weight:700;color:var(--ink);margin-left:4px}
.meta{margin:8px 0 0;color:var(--ink-2);font-size:.875rem;line-height:1.5}

/* 거르기 */
.filter{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.filter button{min-height:48px;padding:8px 16px;border:0;border-radius:999px;background:var(--sunken);color:var(--ink);font:inherit;font-size:.9375rem;font-weight:600;line-height:1.3;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:background-color .15s ease-out}
.filter button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.hint{margin:8px 0 0;color:var(--ink-2);font-size:.875rem;line-height:1.5}

section{margin-top:28px}
h2{display:flex;align-items:center;gap:8px;font-size:1.0625rem;font-weight:700;margin:0 0 2px;color:var(--ink-2)}
h2 .ic{width:20px;height:20px}
h2.warn{color:var(--signal-ink)}

/* 목록. 줄 전체가 기록을 여는 링크이고, 지우기는 오른쪽 위 칸에 따로 둔다. */
.ledger{list-style:none;margin:0;padding:0}
.ledger>li{display:flex;align-items:flex-start;gap:4px;border-bottom:1px solid var(--rule)}
.ledger>li.fresh{margin:0 -8px;padding:0 8px;border-radius:10px;animation:fresh 3.2s ease-out both}
@keyframes fresh{0%,45%{background:var(--good-soft)}100%{background:transparent}}
.row-main{flex:1;min-width:0;display:block;padding:14px 0;color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
.row-main:active{opacity:.72}
.row-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 10px}
.row-head b{font-size:1.0625rem;font-weight:700;overflow-wrap:anywhere}
.row-head time{color:var(--ink-2);font-size:.9375rem}
.verdict{display:flex;align-items:flex-start;gap:6px;margin-top:4px;color:var(--ink-2);font-size:.9375rem;line-height:1.5}
.verdict.warn{color:var(--signal-ink);font-weight:600}
.verdict .ic{width:20px;height:20px;margin-top:1px}
.fee{display:block;margin-top:2px;font-size:.9375rem;line-height:1.5}
.fee b{font-weight:600}
.fee small{color:var(--ink-2);font-size:.875rem;margin-left:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.seal{display:block;margin-top:8px;color:var(--ink-2);font-size:.875rem;line-height:1.5;overflow-wrap:anywhere}
.seal .warn{color:var(--signal-ink);font-weight:600}
.seal-state{white-space:nowrap}
.row-x{flex:none;display:grid;place-items:center;width:48px;height:48px;margin:2px -12px 0 0;padding:0;border:0;border-radius:50%;background:none;color:var(--ink-2);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.row-x .ic{width:20px;height:20px}

.state{display:flex;gap:12px;align-items:flex-start;margin-top:20px;padding:16px;border-radius:16px;background:var(--sunken);color:var(--ink-2)}
.state.error{background:var(--bad-soft);color:var(--bad)}
.state p{margin:0}

/* 빈 화면 */
.steps{margin:14px 0 0;padding:0 0 0 1.5rem;line-height:1.55}
.steps li{padding-left:2px}
.steps li+li{margin-top:6px}

/* 버튼 */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;margin-top:12px;padding:8px 16px;border:0;border-radius:999px;font:inherit;font-size:1rem;font-weight:700;line-height:1.3;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .12s ease-out,background-color .15s ease-out}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.65;cursor:progress}
.btn .ic{width:22px;height:22px}
.primary{background:var(--ink);color:var(--paper)}
.quiet{background:var(--sunken);color:var(--ink);min-height:48px;font-size:.9375rem;font-weight:600}
.danger{background:var(--bad-soft);color:var(--bad);min-height:48px;font-size:.9375rem;font-weight:700}
.pair{display:flex;gap:8px;margin-top:8px}
.pair .btn{flex:1 1 0;min-width:0;margin-top:0;padding-left:10px;padding-right:10px}
.confirm{margin-top:12px;padding:14px 16px 16px;border-radius:16px;background:var(--sunken)}
.confirm p{margin:0;font-size:.9375rem;line-height:1.5}
.confirm .pair{margin-top:12px}
.confirm .quiet{background:var(--paper)}
@media (hover:hover){
  .primary:hover{background:color-mix(in srgb,var(--ink) 84%,var(--paper))}
  .quiet:hover{background:var(--rule)}
  .filter button:not([aria-pressed="true"]):hover{background:var(--rule)}
  .row-main:hover .row-head b{text-decoration:underline;text-underline-offset:3px}
  .row-x:hover{background:var(--sunken);color:var(--ink)}
}

/* 알림은 어디까지 내려와 있든 보이도록 아래에 띄운다. */
.notice{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:2;display:flex;align-items:center;gap:10px;width:calc(100% - 32px);max-width:38rem;min-height:48px;padding:8px 14px;border-radius:14px;background:var(--ink);color:var(--paper);font-size:.9375rem;line-height:1.45;box-shadow:var(--shadow);transform:translateX(-50%);animation:rise .22s cubic-bezier(.16,1,.3,1) both}
.notice[hidden]{display:none}
.notice.miss{background:var(--bad-soft);color:var(--bad)}
.notice .ic{width:20px;height:20px}
.notice span{flex:1;min-width:0}
.notice button{flex:none;min-height:44px;padding:0 6px;border:0;background:none;color:inherit;font:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.notice :focus-visible{outline-color:currentColor}
@keyframes rise{from{transform:translate(-50%,12px);opacity:0}to{transform:translateX(-50%);opacity:1}}

footer{display:flex;gap:8px;margin-top:36px;color:var(--ink-2);font-size:.875rem;line-height:1.55}
footer .ic{width:18px;height:18px;margin-top:2px}
@media (prefers-reduced-motion: reduce){
  .btn,.filter button{transition:none}
  .btn:active{transform:none}
  .ledger>li.fresh{animation:none;background:var(--good-soft)}
  .notice{animation:none}
}
</style>
</head>

<main>
  <div class="top"><span class="brand">차곡</span><span class="doc">반납 목록</span><span id="mark"></span></div>
  <div id="view"><div class="state"><p>목록을 여는 중입니다…</p></div></div>
  <noscript><div class="state error"><p>자바스크립트를 켜야 목록을 열 수 있습니다.</p></div></noscript>
  <footer><svg class="ic" aria-hidden="true"><use href="#i-lock"/></svg><span>이 목록은 이 휴대폰의 브라우저에만 있고 어디로도 보내지지 않습니다. 브라우저 데이터를 지우면 함께 지워지고, 아이폰 Safari는 한동안 열지 않으면 지울 수 있습니다. 오래 둘 기록은 CSV로 내보내 두세요.</span></footer>

(function () {

    doorsOpen: '문', windowsOpen: '창문', trunkOpen: '트렁크', chargePortOpen: '충전구', headlightsOn: '전조등', tailLampOn: '미등', cabinLightOn: '실내등',
    engineOil: '엔진오일', brakeFluid: '브레이크액', washerFluid: '워셔액', telltales: '경고등', tires: '타이어', airbagsDeployed: '에어백',
    doorsLocked: '문 잠금', parkingBrakeEngaged: '주차 브레이크', seatsOccupied: '좌석'
  };
  var ENERGY = ['fuelPercent', 'evSocPercent'];
  var view = document.getElementById('view'), notice = document.getElementById('notice'), mark = document.getElementById('mark');
  var entries = [];    // { item: 저장된 줄, row: 풀어 낸 내용(못 풀면 null) }
  var filter = 'all';
  var asking = false;  // 모두 지우기 확인 중
  var fresh = '';      // 방금 추가한 기록
  var noticeTimer = 0;

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
  function icon(name) { return '<svg class="ic" aria-hidden="true"><use href="#i-' + name + '"/></svg>'; }
  function count(n) { return Math.max(0, Math.floor(+n) || 0); }

  // 시각은 어느 나라에서 열어도 서울 시간으로 쓴다(r/과 같다).
  var SEOUL = new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  function when(value) {
    var date = new Date(value);
    if (isNaN(date)) return null;

    }));
  }

  // ── CSV ──
  // 기록은 링크에서 온 값이라 수식으로 읽히지 않게 막는다.
  function cell(value) {
    var s = value == null ? '' : String(value);
    if (typeof value === 'string' && /^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function sheetTime(value) { var w = when(value); return w ? w.sheet : (value == null ? '' : String(value)); }
  function exportCsv() {
    var list = ordered();
    if (!list.length) return say('내보낼 기록이 없습니다.', { miss: true });
    var head = ['구분', '기록 번호', '차량', '인수 시각(서울)', '반납 시각(서울)', '확인 필요(건)', '확인 필요 항목', '참고 정산(원)', '정산 기준', '확인 불가(건)', '기록 공백(건)', '기록한 사람', '무결성 값', '값 상태', '링크'];
    var lines = list.map(function (e) {
      var r = e.row;
      return [r.kind, r.no, r.vehicle, sheetTime(r.pickupAt), sheetTime(r.at), r.needs, r.needNames.join(', '), r.amounts.length ? r.total : '', r.price, r.unknown, r.gaps,
        r.staff ? '직원' : '고객 반납 체크', r.code, (r.recalculated ? '다시 계산함' : '요약본, 다시 계산 안 함') + (r.conflict ? ', 같은 번호에 다른 코드' : ''), new URL(linkOf(e.item.code), location.href).href];
    });
    var text = '﻿' + [head].concat(lines).map(function (line) { return line.map(cell).join(','); }).join('\r\n') + '\r\n';
    var samples = list.filter(function (e) { return e.row.sample; }).length;
    var name = 'chagok-returns-' + when(Date.now()).day + (samples ? '-with-samples' : '') + '.csv';
    try {
      var url = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
      var a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
      say(list.length + '건을 ' + name + '로 내려받기 시작했습니다.' + (samples ? ' 예시 ' + samples + '건 포함.' : ''));
    } catch (e) {
      say('파일을 만들지 못했습니다. 다른 브라우저에서 다시 시도해 주세요.', { miss: true });
    }
  }

  // ── 동작 ──
  var undo = null;
  function act(name, el) {
    if (name === 'filter') { filter = el.getAttribute('data-value'); render('[data-act="filter"][data-value="' + filter + '"]'); }
    else if (name === 'csv') exportCsv();
    else if (name === 'load-samples') loadSamples(el);
    else if (name === 'clear-samples') clearSamples();
    else if (name === 'clear-ask') { asking = true; render('[data-act="clear-no"]'); }
    else if (name === 'clear-no') { asking = false; render('[data-act="clear-ask"]'); }
    else if (name === 'clear-yes') {
      if (!commit([])) return;
      entries = []; asking = false; filter = 'all'; undo = null;
      render();
      say('목록을 모두 지웠습니다.');
    }
    else if (name === 'remove') {
      var key = el.getAttribute('data-key');
      removeAt(entries.map(function (e) { return e.item && e.item.key; }).indexOf(key));
    }
    else if (name === 'remove-broken') removeAt(+el.getAttribute('data-index'));
    else if (name === 'undo') {
      if (!undo) return;
      var items = entries.map(function (e) { return e.item; });
      items.splice(undo.index, 0, undo.entry.item);
      if (!commit(items)) return;
      entries.splice(undo.index, 0, undo.entry);
      undo = null;
      markConflicts();
      render();
      notice.hidden = true;
    }
    else if (name === 'reset-ask') { asking = true; showBroken(); }
    else if (name === 'reset-no') { asking = false; showBroken(); }
    else if (name === 'reset-yes') {
      try { window.localStorage.removeItem(KEY); } catch (e) { return say('지우지 못했습니다. 브라우저 설정에서 사이트 데이터를 지워 주세요.', { miss: true }); }
      asking = false;
      load();
    }
  }
  function removeAt(index) {
    var entry = entries[index];
    if (!entry) return;
    var items = entries.map(function (e) { return e.item; });
    items.splice(index, 1);
    if (!commit(items)) return;
    entries.splice(index, 1);
    undo = { entry: entry, index: index };
    markConflicts();
    render();
    say((entry.row ? '기록 ' + entry.row.no + '을 ' : '읽지 못한 줄을 ') + '목록에서 지웠습니다.', { action: { act: 'undo', label: '되돌리기' } });
    var back = notice.querySelector('button');
    if (back) back.focus({ preventScroll: true });
  }
  function loadSamples(button) {
    if (entries.some(function (e) { return e.row && e.row.sample; })) { say('이미 예시가 들어 있습니다.', { info: true }); return; }
    if (typeof CompressionStream === 'undefined') { say('이 브라우저에서는 예시를 만들 수 없습니다. Chrome이나 Safari 최신 버전으로 열어 주세요.', { miss: true }); return; }
    button.disabled = true;
    buildSamples().then(function (items) {
      if (!commit(entries.map(function (e) { return e.item; }).concat(items))) { button.disabled = false; return; }
      load(function () { say('예시 ' + items.length + '건을 불러왔습니다. 실제 기록이 아닙니다.'); });
    }).catch(function () {
      button.disabled = false;
      say('예시를 만들지 못했습니다.', { miss: true });
    });
  }
  function clearSamples() {
    var kept = entries.filter(function (e) { return !(e.row && e.row.sample); });
    var gone = entries.length - kept.length;
    if (!commit(kept.map(function (e) { return e.item; }))) return;
    entries = kept; undo = null; asking = false;
    markConflicts();
    render();
    say('예시 ' + gone + '건을 지웠습니다.');
  }
  document.addEventListener('click', function (event) {
    var el = event.target.closest && event.target.closest('[data-act]');
    if (el) act(el.getAttribute('data-act'), el);
  });

  function showBroken() {
    stop('<div class="state error" role="alert">' + icon('error') + '<p>저장된 목록을 읽지 못했습니다. 이 페이지가 아닌 다른 곳에서 데이터가 바뀌었을 수 있습니다.</p></div>' +
      '<section>' + (asking ? '<div class="confirm" role="group" aria-label="저장된 목록 지우기 확인"><p>저장된 목록을 지우고 새로 시작할까요? 되돌릴 수 없습니다.</p><div class="pair"><button type="button" class="btn danger" data-act="reset-yes">지우고 새로 시작</button><button type="button" class="btn quiet" data-act="reset-no">취소</button></div></div>'
        : '<button type="button" class="btn quiet" data-act="reset-ask">저장된 목록 지우기</button>') + '</section>');
  }
  // r/에서 넘어올 때 # 뒤로 알려 준 결과. # 뒤는 서버로 가지 않는다.
  function arrival() {
    var m = /^#(added|exists)=([0-9a-f]{8,64})$/.exec(location.hash);
    if (!m) return null;
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* 주소만 그대로 남는다 */ }
    var hit = entries.filter(function (e) { return String(e.item && e.item.key).replace('sha256:', '').indexOf(m[2]) === 0; })[0];
    if (hit && m[1] === 'added') fresh = hit.item.key;
    var no = hit && hit.row ? '기록 ' + hit.row.no : '이 기록';
    return m[1] === 'added' ? { text: no + '을 목록에 추가했습니다.' } : { text: no + '은 이미 목록에 있어 다시 추가하지 않았습니다.', info: true };
  }
  function load(after) {
    if (typeof DecompressionStream === 'undefined' || !window.crypto || !crypto.subtle) return stop('<div class="state error" role="alert">' + icon('error') + '<p>이 브라우저에서는 목록을 열 수 없습니다. Chrome이나 Safari 최신 버전으로 열어 주세요.</p></div>');
    if (!storageWorks()) return stop('<div class="state error" role="alert">' + icon('error') + '<p>이 브라우저에서는 목록을 저장할 수 없습니다. 시크릿 모드이거나 사이트 데이터가 막혀 있을 수 있습니다. 일반 창에서 열거나 사이트 데이터를 허용한 뒤 다시 열어 주세요.</p></div>');
    var items;
    try { items = readItems(); } catch (e) { return showBroken(); }
    Promise.all(items.map(openItem)).then(function (list) {
      entries = list;
      markConflicts();
      var message = arrival();
      render();
      if (message) say(message.text, message);
      if (after) after();
    });
  }
  // 다른 탭에서 추가했거나, 뒤로 가기로 돌아온 경우
  window.addEventListener('storage', function (e) { if (e.key === KEY || e.key === null) load(); });
  window.addEventListener('pageshow', function (e) { if (e.persisted) load(); });
  load();
})();
</script>
</body>
</html>
