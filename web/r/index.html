<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>차곡 기록</title>
<style>
/*
  고객 리포트 웹(기능 정의서 M-01). 데이터는 링크의 # 뒤에만 있고 서버로 가지 않는다. 외부 스크립트·글꼴을 쓰지 않는다.
  주된 순간은 며칠 뒤 업체 문자를 받고 다시 여는 때다. 그래서 결론 → 보낼 문구 → 보관 → 항목별 내용 → 근거 순서로 둔다.
  색은 차 화면(app/ui/Theme.kt)과 같다. 주황은 '확인 필요'에만, 초록은 고객을 보호하는 사실('인수 때부터')과 완료에만 쓴다.
  누르는 것은 잉크색으로 채워 '문제'와 '누르세요'를 구분한다.
*/
:root{
  --paper:#F2F4F5;--raised:#FFFFFF;--sunken:#E5E9EB;--rule:#D5DBDE;
  --ink:#14191C;--ink-2:#55616A;--ink-3:#8B969D;
  --signal:#EC9846;--on-signal:#1C1206;--signal-ink:#A4570F;--signal-soft:#FCEAD6;
  --good:#1E7A4C;--good-soft:#DCF0E4;--bad:#B3261E;--bad-soft:#F9DEDC;
  --shadow:0 6px 24px rgba(0,0,0,.08);
  --sans:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","Roboto Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121719;--raised:#1B2225;--sunken:#20292D;--rule:#2C353B;
    --ink:#E3E7E9;--ink-2:#9BA6AE;--ink-3:#66727A;
    --signal-ink:#EFA35C;--signal-soft:#3A2919;--good:#74CFA0;--good-soft:#173226;--bad:#F2B8B5;--bad-soft:#3D2020;
    --shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121719;--raised:#1B2225;--sunken:#20292D;--rule:#2C353B;
  --ink:#E3E7E9;--ink-2:#9BA6AE;--ink-3:#66727A;
  --signal-ink:#EFA35C;--signal-soft:#3A2919;--good:#74CFA0;--good-soft:#173226;--bad:#F2B8B5;--bad-soft:#3D2020;
  --shadow:none;color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
::selection{background:var(--rule);color:var(--ink)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
main{max-width:40rem;margin:0 auto;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.num{font-variant-numeric:tabular-nums}
.ic{width:24px;height:24px;flex:none;fill:currentColor}

.top{display:flex;align-items:center;gap:8px;min-height:44px}
.brand{font-weight:700;font-size:1.125rem;letter-spacing:.02em}
.doc{color:var(--ink-2);font-size:.9375rem}
#demo{margin-left:auto}
.tag{display:inline-flex;align-items:center;font-size:.8125rem;font-weight:600;line-height:1;padding:7px 10px;border-radius:8px;background:var(--sunken);color:var(--ink-2)}

/* 결론. 제목 자체가 답이다. 숫자는 굵은 잉크, 잇는 말은 한 단 낮춘다. */
h1{font-size:1.625rem;line-height:1.35;font-weight:500;letter-spacing:-.01em;margin:10px 0 0;color:var(--ink-2)}
h1 .l{display:block;text-wrap:balance}
h1 b{font-weight:700;color:var(--ink)}
h1 .warn,h1 .warn b{color:var(--signal-ink)}
.basis{margin:4px 0 0;color:var(--ink-2);font-size:.875rem}
.status{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:6px;font-size:.9375rem;line-height:1.5}
.status li{display:flex;gap:8px;color:var(--ink-2)}
.status .ic{width:20px;height:20px;margin-top:1px}
.status b{font-weight:700;margin-right:6px}
.status .warn .ic,.status .warn b{color:var(--signal-ink)}
.status .good .ic,.status .good b{color:var(--good)}
.note{display:flex;gap:8px;margin:10px 0 0;color:var(--ink-2);font-size:.8125rem;line-height:1.5}
.note .ic{width:18px;height:18px;margin-top:1px}
.meta{margin:12px 0 0;color:var(--ink-2);font-size:.875rem;line-height:1.55}
.meta p{margin:0}
.meta b{font-weight:600;color:var(--ink)}

/* 보낼 문구와 보관. 면은 문구 칸 하나만 쓴다. */
.act{margin-top:24px}
.act h2{color:var(--ink);font-size:1.125rem;font-weight:700;margin:0}
.hint{margin:2px 0 0;color:var(--ink-2);font-size:.9375rem;line-height:1.5}
.quote{margin:10px 0 0;padding:12px 14px;border-radius:12px;background:var(--sunken);font-size:.9375rem;line-height:1.55}
.quote .link{color:var(--ink-2);overflow-wrap:anywhere}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;margin-top:12px;padding:8px 16px;border:0;border-radius:999px;font:inherit;font-size:1rem;font-weight:700;line-height:1.3;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .12s ease-out,background-color .15s ease-out}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.65;cursor:progress}
.btn .ic{width:22px;height:22px}
.primary{background:var(--ink);color:var(--paper)}
.quiet{background:var(--sunken);color:var(--ink);min-height:48px;font-size:.9375rem;font-weight:600}
.pair{display:flex;gap:8px;margin-top:8px}
.pair .btn{flex:1 1 0;min-width:0;margin-top:0;padding-left:8px;padding-right:8px}
.done{margin:0;color:var(--good);font-size:.875rem;font-weight:600}
.done:not(:empty){margin-top:10px}
.done.miss{color:var(--ink)}
.manual{display:block;width:100%;margin-top:10px;padding:12px;border:1px solid var(--rule);border-radius:12px;background:var(--raised);color:var(--ink);font:inherit;font-size:16px;line-height:1.45;resize:vertical}
.manual[hidden],.shot[hidden]{display:none}
.shot{margin:12px 0 0}
.shot img{display:block;width:100%;max-width:280px;height:auto;border:1px solid var(--rule);border-radius:8px}
.shot figcaption{margin-top:8px;color:var(--ink-2);font-size:.875rem;line-height:1.5}
@media (hover:hover){
  .primary:hover{background:color-mix(in srgb,var(--ink) 84%,var(--paper))}
  .quiet:hover{background:var(--rule)}
}

/* 13칸 막대: 칸 하나가 비교한 항목 하나다. 꽉 찬 칸은 확인 필요·인수 때부터·변화 없음, 테두리 칸은 참고·확인 불가. */
.strip{display:flex;gap:4px;margin:10px 0 12px}
.strip span{flex:1;height:20px;border-radius:5px}
.v-NEEDS_CHECK{background:var(--signal)}
.v-SHIELD{background:var(--good)}
.v-NOTE{border:2.5px solid var(--ink-2)}
.v-UNCHANGED{background:var(--ink-3);background:color-mix(in srgb,var(--ink-2) 35%,transparent)}
.v-UNKNOWN{border:2.5px dashed var(--ink-3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0;padding:0;list-style:none;font-size:.9375rem;color:var(--ink-2)}
.legend li{display:flex;align-items:center;gap:8px}
.legend i{width:14px;height:14px;border-radius:4px;flex:none}
.legend b{color:var(--ink);font-size:1.0625rem}

section{margin-top:32px}
h2{display:flex;align-items:center;gap:8px;font-size:1.0625rem;font-weight:700;margin:0 0 4px;color:var(--ink-2)}
h2 .ic{width:20px;height:20px}
h2.warn{color:var(--signal-ink)}
h2.good{color:var(--good)}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--rule)}
.badge{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--sunken);color:var(--ink-2)}
.warn .badge{background:var(--signal-soft);color:var(--signal-ink)}
.good .badge{background:var(--good-soft);color:var(--good)}
.badge .ic{width:22px;height:22px}
.text{flex:1;min-width:0}
.text strong{display:block;font-weight:600;font-size:1rem;line-height:1.45;margin-top:8px}
.text span{display:block;color:var(--ink-2);font-size:.9375rem;line-height:1.5}
.text .says{color:var(--good);font-weight:600}
.dim .text strong{color:var(--ink-2);font-weight:500}
.values{display:flex;justify-content:space-between;gap:12px;margin-top:6px;color:var(--ink-2);font-size:.875rem}
.values span{font-size:inherit}
.text .values span:last-child{text-align:right}
.values b{color:var(--ink);font-weight:600}
.bar{position:relative;height:10px;margin:8px 0 4px;border-radius:5px;background:var(--sunken)}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px 0 0 5px;background:var(--ink-2)}
.bar b{position:absolute;top:0;bottom:0;background:var(--ink-3)}
.warn .bar b{background:var(--signal)}
.bar u{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0;padding:0;list-style:none}
.chips li{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:10px;background:var(--sunken);color:var(--ink-2);font-size:.9375rem}
.chips .ic{width:18px;height:18px}

/* 대여 중 기록: 시각 칸과 내용 칸 두 줄로 읽는다. */
.tl{list-style:none;margin:8px 0 0;padding:0}
.tl li{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--rule);line-height:1.5}
.tl time{color:var(--ink-2);font-size:.9375rem;white-space:nowrap}
.tl .gap{color:var(--ink-2);border-bottom-style:dashed}
.tl .gap b{display:flex;align-items:flex-start;gap:6px;font-weight:600}
.tl .gap .ic{width:20px;height:20px;margin-top:2px}
.tl .gap span span{display:block;font-size:.9375rem}
.tl-more{margin:10px 0 0;color:var(--ink-2);font-size:.9375rem}
.tl-more b{font-weight:600;color:var(--ink)}

/* 인수 기록: 값이 주인공이라 칸 위에 선을 둔 표로 보인다. */
.facts{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;margin-top:8px}
.fact{border-top:1px solid var(--rule);padding:14px 0 18px;min-width:0}
.fact-label{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:.875rem}
.fact-label .ic{width:18px;height:18px}
.fact-value{display:block;font-size:1.25rem;font-weight:600;line-height:1.35;margin-top:4px}
.fact.dim .fact-value{color:var(--ink-2);font-weight:500;font-size:1rem}

/* 근거: 무결성 값과 시각, 적용 기준. 말할 때 읽어 줄 수 있게 값을 오른쪽 끝에 맞춘다. */
.seal-head{display:flex;align-items:center;gap:6px;margin-top:8px;color:var(--ink-2);font-size:.875rem}
.seal-head .ic{width:18px;height:18px}
.seal-value{display:block;font-family:var(--mono);font-size:1.375rem;font-weight:600;line-height:1.3;letter-spacing:.05em;margin-top:2px}
.seal-note{margin:4px 0 0;color:var(--ink-2);font-size:.875rem;line-height:1.5}
.proof{margin:12px 0 0}
.proof div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--rule);font-size:.9375rem;line-height:1.5}
.proof dt{flex:none;color:var(--ink-2)}
.proof dd{margin:0;min-width:0;text-align:right;font-weight:600}
.proof small{display:block;color:var(--ink-2);font-size:.875rem;font-weight:400}

.state{display:flex;gap:12px;align-items:flex-start;margin-top:24px;padding:16px;border-radius:16px;background:var(--sunken);color:var(--ink-2)}
.state.error{background:var(--bad-soft);color:var(--bad)}
.state p{margin:0}
/* 업체용 길. 고객의 행동(채운 버튼)과 섞이지 않게 선 아래 글자 버튼으로만 둔다. */
.ops{margin-top:40px;padding-top:6px;border-top:1px solid var(--rule)}
.ops-add{display:flex;align-items:center;min-height:48px;padding:0;border:0;background:none;color:var(--ink-2);font:inherit;font-size:.9375rem;line-height:1.45;text-align:left;text-decoration:underline;text-underline-offset:3px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.ops-hint{margin:0;color:var(--ink-2);font-size:.875rem;line-height:1.5}
@media (hover:hover){.ops-add:hover{color:var(--ink)}}
footer{display:flex;gap:8px;margin-top:40px;color:var(--ink-2);font-size:.8125rem;line-height:1.5}
footer .ic{width:18px;height:18px;margin-top:1px}
@media (prefers-reduced-motion: reduce){.btn{transition:none}.btn:active{transform:none}}
</style>
</head>

    if (v === 'NORMAL') return '정상';
    if (v === 'LOW') return '부족';
    if (key === 'telltales') return v.length ? v.map(function (t) { return t.label; }).join(', ') : '없음';
    if (key === 'tires') {
      var low = Object.keys(v).filter(function (a) { return v[a].low; });
      if (low.length) return low.map(function (a) { return SIDES[a] + ' 저압'; }).join(', ');
      return Object.keys(v).every(function (a) { return v[a].low === false; }) ? '저압 없음' : '저압 확인 못 함';
    }
    var on = Object.keys(v).filter(function (a) { return v[a]; });
    var word = key === 'airbagsDeployed' ? ['전개', '전개 없음'] : ['열림', '모두 닫힘'];
    return on.length ? on.map(function (a) { return AREAS[a]; }).join(', ') + ' ' + word[0] : word[1];
  }

  // 인수 때 이미 있던 것(켜진 경고등, 부족한 소모품, 저압 타이어, 전개된 에어백)은 고객을 보호하는 사실이다.
  function already(key, r) {
    if (r.status !== 'OK') return false;
    var v = r.value;
    if (key === 'telltales') return v.length > 0;
    if (v === 'LOW') return true;
    if (key === 'tires') return Object.keys(v).some(function (a) { return v[a].low; });
    if (key === 'airbagsDeployed') return Object.keys(v).some(function (a) { return v[a]; });
    return false;
  }

  function hero(m) {
    return '<h1>' + m.lead.map(function (l) { return '<span class="l' + (l.warn ? ' warn' : '') + '">' + emphasis(l.text) + '</span>'; }).join('') + '</h1>' +
      (m.basis ? '<p class="basis num">' + esc(m.basis) + '</p>' : '') +
      (m.status.length ? '<ul class="status">' + m.status.map(function (s) {
        return '<li class="' + s.tone + '">' + icon(s.icon) + '<span>' + (s.head ? '<b class="num">' + esc(s.head) + '</b>' : '') + esc(s.text) + '</span></li>';
      }).join('') + '</ul>' : '') +
      (m.disclaimer ? '<p class="note">' + icon('info') + '<span>' + esc(DISCLAIMER) + '</span></p>' : '') +
      '<div class="meta"><p>기록 번호 <b class="num">' + esc(m.no) + '</b> · 차량 ' + esc(m.vehicle) + '</p><p class="num">' + esc(m.period) + '</p></div>';
  }

  // 문자로 답장할 문구. 사실만 쓴다(core Wording의 금지어를 쓰지 않는다). 링크는 맨 뒤에 둔다.
  function message(m) {
    return (m.mark ? '[' + m.mark + '] ' : '') + m.opener + ' ' + m.no + ', 코드 ' + m.code +
      (m.facts.length ? ' 기준 ' + m.facts.join(', ') + '입니다.' : '입니다.') +
      (m.shields.length ? ' ' + m.shieldWord + ': ' + some(m.shields.map(function (s) { return s.replace(/: (.+)$/, '($1)'); }), 3) + '.' : '');
  }

  function actions(m) {
    var link = location.href;
    return '<section class="act"><h2>업체에 보낼 문구</h2>' +
      '<p class="hint">업체에서 연락이 오면 답장에 그대로 붙여 넣으세요.</p>' +
      '<p class="quote num">' + esc(message(m)) + ' 링크: <span class="link">' + esc(link.replace(/#.*$/, '#…')) + '</span></p>' +
      '<button type="button" class="btn primary" id="copy-text">' + icon('copy') + '<span>문구 복사</span></button>' +
      '<p class="done" id="copy-text-done" role="status"></p>' +
      '<textarea class="manual" id="copy-text-manual" rows="6" readonly hidden aria-label="복사할 문구"></textarea></section>' +
      '<section class="act"><h2>직접 다시 열려면 이 링크가 필요합니다</h2>' +
      '<p class="hint">같은 기록이 차에 180일 보관된 뒤 지워지고, 그동안에도 직원만 열 수 있습니다. 서버에는 저장되지 않아, 보관하지 않으면 이 휴대폰의 방문 기록에만 남습니다.</p>' +
      '<button type="button" class="btn primary" id="keep">' + icon('share') + '<span>링크 보관하기</span></button>' +
      '<div class="pair">' +
      (navigator.share ? '<button type="button" class="btn quiet" id="copy-link">' + icon('copy') + '<span>링크 복사</span></button>' : '') +
      '<button type="button" class="btn quiet" id="save-image">' + icon('download') + '<span>이미지로 저장</span></button></div>' +
      '<p class="done" id="keep-done" role="status"></p>' +
      '<textarea class="manual" id="keep-manual" rows="4" readonly hidden aria-label="복사할 링크"></textarea>' +
      '<figure class="shot" id="shot" hidden><img id="shot-image" alt="기록 요약 이미지"><figcaption>저장되지 않았다면 이미지를 길게 눌러 저장하세요. 이미지는 요약이며, 기록을 다시 열려면 링크가 필요합니다.</figcaption></figure></section>';
  }

  function proof(m) {
    return '<section><h2>근거</h2>' +
      '<div class="seal-head">' + icon('info') + '<span>무결성 값</span></div>' +
      '<strong class="seal-value num">' + esc(m.code) + '</strong>' +
      m.codeNotes.map(function (n) { return '<p class="seal-note">' + esc(n) + '</p>'; }).join('') +
      '<dl class="proof">' + m.proof.map(function (p) {
        return '<div><dt>' + esc(p[0]) + '</dt><dd class="num">' + esc(p[1]) + (p[2] ? '<small>' + esc(p[2]) + '</small>' : '') + '</dd></div>';
      }).join('') + '</dl></section>';
  }

  function values(r) {
    if (r.before == null && r.after == null) return '';
    function shown(v) { return v == null ? '값 없음' : v; }
    return '<div class="values num"><span>인수 <b>' + esc(shown(r.before)) + '</b></span><span>반납 <b>' + esc(shown(r.after)) + '</b></span></div>';
  }

  function rowItem(r, tone, notes) {
    var lines = r.verdict === 'UNKNOWN' ? [r.label + ' · ' + notes.join(', ')] : notes;
    var written = notes.join(' ');
    var before = percent(r.before), after = percent(r.after);
    var extra = '';
    if (ENERGY.indexOf(r.item) >= 0 && after !== null) {
      var low = before !== null && before > after ? before - after : 0;
      extra = values(r) + '<div class="bar" role="img" aria-label="인수 ' + esc(r.before || '값 없음') + ', 반납 ' + esc(r.after) + '">' +
        '<i style="width:' + after + '%"></i>' + (low ? '<b style="left:' + after + '%;width:' + low + '%"></b>' : '') +
        (before !== null && before !== after ? '<u style="left:' + before + '%"></u>' : '') + '</div>';
    } else if (!(r.before != null && r.after != null && written.indexOf(r.before) >= 0 && written.indexOf(r.after) >= 0)) {
      // 문구에 없는 값이면 인수·반납 값을 밑에 적는다(주행 312km → 인수 23,410km, 반납 23,722km).
      extra = values(r);
    }
    return '<li class="' + tone + '"><span class="badge">' + iconFor(r.item) + '</span><div class="text">' +
      '<strong>' + esc(lines[0] || r.label) + '</strong>' +
      lines.slice(1).map(function (n) { return '<span>' + esc(n) + '</span>'; }).join('') + extra + '</div></li>';
  }

  function timelineOf(json) {
    var items = [];
    (Array.isArray(json.timeline) ? json.timeline : []).forEach(function (t) { if (t && t.note) items.push({ at: t.at, note: String(t.note) }); });
    (Array.isArray(json.gaps) ? json.gaps : []).forEach(function (g) { if (g && g.from) items.push({ at: g.from, to: g.to, gap: true }); });
    items.sort(function (a, b) { return (new Date(a.at) - new Date(b.at)) || 0; });
    function count(n) { return Math.max(0, Math.floor(+n) || 0); }
    var more = count(json.timelineMore);
    // 줄이 하나도 없으면(요약본) '외'가 어색하다.
    var moreWord = !more ? '' : (items.some(function (e) { return !e.gap; }) ? '외 ' : '변화 기록 ') + more + '건';
    return { items: items, moreWord: moreWord, gapsMore: count(json.gapsMore) };
  }
  function gapEnd(g) {
    if (!g.to) return '';
    if (underMinute(g.at, g.to)) return '1분 미만';
    var length = span(g.at, g.to);
    return endOf(g.at, g.to) + '까지' + (length ? ' · ' + length : '');
  }
  function timelineSection(t) {
    if (!t.items.length && !t.moreWord && !t.gapsMore) return '';
    var body = t.items.length ? '<ul class="tl">' + t.items.map(function (e) {
      var at = '<time class="num" datetime="' + esc(e.at == null ? '' : e.at) + '">' + esc(stamp(e.at)) + '</time>';
      if (!e.gap) return '<li>' + at + '<span>' + esc(e.note) + '</span></li>';
      return '<li class="gap">' + at + '<span><b>' + icon('gap') + '앱이 기록하지 못한 구간</b><span class="num">' + esc(gapEnd(e)) + '</span></span></li>';
    }).join('') + '</ul>' : '';
    var more = t.moreWord ? '<p class="tl-more"><b class="num">' + esc(t.moreWord) + '</b>은 이 링크에 담기지 않았습니다.</p>' : '';
    var gapsMore = t.gapsMore ? '<p class="tl-more">앱이 기록하지 못한 구간 <b class="num">외 ' + t.gapsMore + '건</b>도 이 링크에 담기지 않았습니다.</p>' : '';
    return '<section><h2>대여 중 기록</h2><p class="hint">시각은 서울 시간입니다.</p>' + body + more + gapsMore + '</section>';
  }
  function timelineLines(t) {
    return t.items.map(function (e) { return e.gap ? stamp(e.at) + ' 앱이 기록하지 못한 구간 ' + gapEnd(e) : stamp(e.at) + ' ' + e.note; })
      .concat(t.moreWord ? [t.moreWord] : [], t.gapsMore ? ['앱이 기록하지 못한 구간 외 ' + t.gapsMore + '건'] : []);
  }

  function reportModel(json, hash) {
    var summary = /^report-summary\//.test(json.schema);
    // 요약본의 코드는 차에 있는 전체 기록의 값을 옮겨 적은 것이다. 없을 때만 이 내용으로 계산한 값을 쓴다.
    var recalculated = !summary || !json.reportHash;
    // 문구는 기록에 묶여 있어 고치지 않고 보여 줄 때만 바꾼다. demo/ 기준의 단가는 업체가 정한 값이 아니다.
    var demoPrice = /^demo\//.test(String(json.policy || ''));
    var priceWord = demoPrice ? '시연 단가' : '업체 기준';
    function priced(note) { return demoPrice ? String(note).replace(/업체 기준/g, priceWord) : note; }
    var rows = (json.rows || []).map(function (r) { return Object.assign({ label: nameOf(r.item) }, r, { notes: (r.notes || []).map(priced) }); });
    var c = json.counts || {};
    var needs = c.NEEDS_CHECK || 0;
    var unknown = c.UNKNOWN || 0;
    var timeline = timelineOf(json);
    var gapCount = timeline.items.filter(function (e) { return e.gap; }).length + timeline.gapsMore;
    function own(r) { return r.notes.filter(function (n) { return !SHIELD_MARK.test(n); }); }
    function onlyShield(r) { return r.verdict === 'NOTE' && r.notes.length > 0 && !own(r).length; }
    function group(v) { return rows.filter(function (r) { return r.verdict === v && !onlyShield(r); }); }

    // '(인수 때부터)'는 줄이 아니라 문구 단위로 본다. 경고등 한 줄에 새 경고등과 인수 때부터 켜진 경고등이 함께 올 수 있다.
    var shields = [];
    rows.forEach(function (r) {
      r.notes.forEach(function (n) { if (SHIELD_MARK.test(n)) shields.push({ row: r, text: n.replace(SHIELD_MARK, '') }); });
    });
    var shieldTexts = shields.map(function (s) { return s.text; });
    var shieldRows = rows.filter(onlyShield).length;
    var cells = { NEEDS_CHECK: needs, SHIELD: shieldRows, NOTE: Math.max(0, (c.NOTE || 0) - shieldRows), UNCHANGED: c.UNCHANGED || 0, UNKNOWN: c.UNKNOWN || 0 };

    // 요약본은 변화 없는 항목을 v1은 이름, v2는 항목 키로 담는다.
    var quiet = summary ? (json.unchanged || []).map(function (x) { return NAMES[x] ? { item: x, label: NAMES[x] } : { item: keyOf(x), label: x }; })
      : rows.filter(function (r) { return r.verdict === 'UNCHANGED'; });
    function chipText(q) { return q.label + (q.after && USUAL.indexOf(q.after) < 0 ? ' ' + q.after : ''); }

    // 결론의 재료: 연료·배터리 변화, 참고 금액
    var energy = ENERGY.map(function (key) {
      var row = rows.filter(function (r) { return r.item === key; })[0];
      if (row) return row;
      return quiet.some(function (q) { return q.item === key; }) ? { item: key, label: nameOf(key), verdict: 'UNCHANGED' } : null;
    }).filter(Boolean);
    function change(e) {
      var b = e.before, a = e.after;
      if (b != null && a != null && b !== a) return { page: b + ' → ' + a, text: (/%$/.test(b) && /%$/.test(a) ? b.slice(0, -1) : b) + '→' + a };
      if (a != null && b === a) return { page: a + ' 그대로', text: a + ' 변화 없음' };
      if (e.verdict === 'UNCHANGED') return { page: '변화 없음', text: '변화 없음' };
      if (a != null) return { page: '반납 ' + a, text: '반납 ' + a };
      return { page: '확인 불가', text: '확인 불가' };
    }
    var amounts = [];
    rows.forEach(function (r) {
      r.notes.forEach(function (n) {
        var won = /(\d[\d,]*)\s*원/.exec(n);
        if (!won || !(/참고 정산/.test(n) || ENERGY.indexOf(r.item) >= 0 || r.item === 'evCharging')) return;
        var size = /약\s*[\d.,]+\s*(?:kWh|L|%p?)/i.exec(n);
        amounts.push({ name: r.label, won: '약 ' + won[1] + '원', size: size ? size[0] : '' });
      });
    });

    var lead = energy.length ? [{ text: energy.map(function (e) { return e.label + ' *' + change(e).page + '*'; }).join(', ') + ',' }] : [];
    if (amounts.length) lead.push({ text: '참고 정산 ' + amounts.map(function (a) { return (amounts.length > 1 ? a.name + ' ' : '') + '*' + a.won + '*'; }).join(', ') + '입니다.' });
    else if (needs) lead.push({ text: '확인 필요 *' + needs + '건*입니다.', warn: true });
    else lead.push({ text: '확인 필요한 항목이 없습니다.' });

    var sizes = amounts.map(function (a) { return a.size; }).filter(Boolean);
    var needNames = group('NEEDS_CHECK').map(function (r) { return r.label; });
    var status = [];
    if (needs && (amounts.length || needNames.length)) status.push({ tone: 'warn', icon: 'warning', head: amounts.length ? '확인 필요 ' + needs + '건' : '', text: some(needNames, 4) });
    if (shields.length) status.push({ tone: 'good', icon: 'shield', head: '인수 때부터 있던 항목 ' + shields.length + '건', text: some(shieldTexts, 3) });
    // '확인 필요한 항목이 없습니다'는 비교한 항목만 말한다. 읽지 못한 항목과 기록하지 못한 구간은 결론 바로 아래에 함께 적는다.
    if (unknown || gapCount) status.push({ tone: '', icon: 'gap', head: '', text: [unknown ? '확인 불가 ' + unknown + '건' : '', gapCount ? '앱이 기록하지 못한 구간 ' + gapCount + '건' : ''].filter(Boolean).join(' · ') });

    function verdictSection(v) {
      var list = group(v);
      if (!list.length) return '';
      var warn = v === 'NEEDS_CHECK';
      return '<section><h2 class="' + (warn ? 'warn' : '') + '">' + (warn ? icon('warning') : '') + VERDICTS[v] + ' <span class="num">' + list.length + '</span></h2>' +
        '<ul class="rows">' + list.map(function (r) { return rowItem(r, warn ? 'warn' : v === 'UNKNOWN' ? 'dim' : '', own(r)); }).join('') + '</ul></section>';
    }
    function shieldSection() {
      if (!shields.length) return '';
      return '<section><h2 class="good">' + icon('shield') + '인수 때부터 있던 항목 <span class="num">' + shields.length + '</span></h2><ul class="rows">' +
        shields.map(function (s) {
          return '<li class="good"><span class="badge">' + iconFor(s.row.item) + '</span><div class="text"><strong>' + esc(s.text) + '</strong>' +
            '<span class="says">이 항목은 인수 기록에 있었습니다.</span>' + values(s.row) + '</div></li>';
        }).join('') + '</ul></section>';
    }
    function chips() {
      if (!quiet.length) return '';
      return '<section><h2>변화 없음 <span class="num">' + quiet.length + '</span></h2><ul class="chips">' +
        quiet.map(function (q) { return '<li>' + (q.item ? iconFor(q.item) : '') + esc(chipText(q)) + '</li>'; }).join('') + '</ul></section>';
    }
    var stripCells = [];
    ORDER.forEach(function (v) { for (var i = 0; i < cells[v]; i++) stripCells.push(v); });
    var overview = stripCells.length ? '<section><h2>비교한 항목 <span class="num">' + stripCells.length + '</span></h2>' +
      '<div class="strip" aria-hidden="true">' + stripCells.map(function (v) { return '<span class="v-' + v + '"></span>'; }).join('') + '</div>' +
      '<ul class="legend">' + ORDER.filter(function (v) { return v !== 'SHIELD' || cells.SHIELD; }).map(function (v) {
        return '<li><i class="v-' + v + '"></i>' + VERDICTS[v] + ' <b class="num">' + cells[v] + '</b></li>';
      }).join('') + '</ul></section>' : '';
    function notesOf(v) { return group(v).reduce(function (all, r) { return all.concat(own(r)); }, []); }
    var groups = [
      { title: '확인 필요 ' + needs + '건', tone: 'warn', lines: notesOf('NEEDS_CHECK') },
      { title: '인수 때부터 있던 항목 ' + shields.length + '건', tone: 'good', says: '이 항목은 인수 기록에 있었습니다.', lines: shieldTexts },
      { title: '참고', lines: notesOf('NOTE') },
      { title: '대여 중 기록(서울 시간)', lines: timelineLines(timeline) },
      { title: '변화 없음 ' + quiet.length + '건', lines: quiet.length ? [quiet.map(chipText).join(', ')] : [] },
      { title: '확인 불가', lines: group('UNKNOWN').map(function (r) { return r.label + ' · ' + r.notes.join(', '); }) }
    ].filter(function (g) { return g.lines.length; });

    var length = span(json.pickup.at, json['return'].at);
    var byStaff = json.recordedBy === 'staff';
    return {
      doc: byStaff ? '반납 리포트 · 직원 기록' : '반납 리포트', opener: byStaff ? '차곡 직원 기록' : '차곡 기록', no: json.recordNo, vehicle: vehicleOf(json.vehicleId), mark: markOf(json),
      code: short(recalculated ? hash : json.reportHash), summary: summary,
      period: underMinute(json.pickup.at, json['return'].at) ? stamp(json.pickup.at) + ' (1분 미만)'
        : stamp(json.pickup.at) + ' → ' + endOf(json.pickup.at, json['return'].at) + (length ? ' (' + length + ')' : ''),
      lead: lead, status: status, disclaimer: true,
      basis: amounts.length ? priceWord + ' · ' + (sizes.length ? sizes.join(', ') + ' · ' : '') + '청구 확정은 업체' : '',
      facts: energy.map(function (e) { return e.label + ' ' + change(e).text; }).concat(amounts.length
        ? '참고 정산 ' + amounts.map(function (a) { return (amounts.length > 1 ? a.name + ' ' : '') + a.won; }).join(', ') + (demoPrice ? '(시연 단가)' : '') : '확인 필요 ' + needs + '건',
        unknown ? ['확인 불가 ' + unknown + '건'] : []),
      shields: shieldTexts, shieldWord: '인수 기록에 있던 항목',
      details: overview + verdictSection('NEEDS_CHECK') + shieldSection() + verdictSection('NOTE') + timelineSection(timeline) + chips() + verdictSection('UNKNOWN'),
      strip: stripCells, groups: groups,
      codeNotes: recalculated ? CODE_FULL : CODE_SUMMARY,
      proof: [
        ['기록 번호', json.recordNo], ['차량', vehicleOf(json.vehicleId), vehicleNote(json)],
        ['인수', fullStamp(json.pickup.at), json.pickup.hash ? '코드 ' + short(json.pickup.hash) : ''],
        ['반납', fullStamp(json['return'].at), json['return'].hash ? '코드 ' + short(json['return'].hash) : ''],
        ['적용 기준', [json.rules, json.policy].filter(Boolean).join(' · ') || '-', demoPrice ? '시연 단가는 실제 업체 단가가 아닙니다' : '']
      ].concat(byStaff ? [['기록한 사람', '직원', '고객의 반납 체크 없이 남긴 기록']] : [])
    };
  }

  function snapshotModel(json, hash) {
    var pickup = json.kind !== 'RETURN';
    var word = pickup ? '인수' : '반납';
    var readings = json.readings || {};
    var known = Object.keys(LABELS).filter(function (k) { return readings[k] && readings[k].status !== 'UNSUPPORTED'; });
    var flagged = pickup ? ['telltales', 'airbagsDeployed', 'tires', 'engineOil', 'brakeFluid', 'washerFluid'].filter(function (k) { return readings[k] && already(k, readings[k]); }) : [];
    var rest = known.filter(function (k) { return flagged.indexOf(k) < 0; });
    function flagText(k) { return (k === 'telltales' ? '경고등 켜짐: ' : LABELS[k] + ' ') + reading(k, readings[k]); }
    // 공기압 수치가 정상이어도 경고등이 켜졌으면 '저압 없음'이라고 하지 않는다(:core와 같다).
    var tireLamp = readings.telltales && readings.telltales.status === 'OK' && readings.telltales.value.some(function (t) { return t.code === 'TPMS'; });
    function shown(k) { return k === 'tires' && tireLamp && readings[k].status === 'OK' && !already(k, readings[k]) ? '공기압 경고등 켜짐' : reading(k, readings[k]); }
    var flags = flagged.map(flagText);
    var headline = ['fuelPercent', 'evSocPercent', 'odometerKm'].filter(function (k) { return readings[k] && readings[k].status === 'OK'; });
    function bit(k) { return LABELS[k] + ' *' + reading(k, readings[k]) + '*'; }
    var levels = headline.filter(function (k) { return k !== 'odometerKm'; }).map(bit);
    var distance = headline.indexOf('odometerKm') >= 0 ? bit('odometerKm') : '';
    var head = '인수 때 이미 있던 항목 ' + flags.length + '건';
    return {
      doc: word + ' 기록', opener: '차곡 ' + word + ' 기록', no: json.recordNo, vehicle: vehicleOf(json.vehicleId), mark: markOf(json),
      code: short(hash), period: stamp(json.capturedAt),
      lead: levels.length && distance ? [{ text: word + ' 때 ' + levels.join(', ') + ',' }, { text: distance + '입니다.' }]
        : levels.length || distance ? [{ text: word + ' 때 ' + (levels.join(', ') || distance) + '입니다.' }] : [{ text: word + ' 기록입니다.' }],
      status: flags.length ? [{ tone: 'good', icon: 'shield', head: head, text: some(flags, 3) }] : [],
      disclaimer: false, basis: '',
      facts: headline.map(function (k) { return LABELS[k] + ' ' + reading(k, readings[k]); }),
      shields: flags, shieldWord: '인수 때 있던 항목',
      details: (flags.length ? '<section><h2 class="good">' + icon('shield') + '인수 때 이미 있던 항목 <span class="num">' + flags.length + '</span></h2><ul class="rows">' +
          flagged.map(function (k) {
            return '<li class="good"><span class="badge">' + iconFor(k) + '</span><div class="text"><strong>' + esc(flagText(k)) + '</strong><span class="says">이 항목은 인수 기록에 있습니다.</span></div></li>';
          }).join('') + '</ul></section>' : '') +
        '<section><h2>' + word + ' 때 상태</h2><div class="facts">' + rest.map(function (k) {
          var r = readings[k];
          return '<div class="fact ' + (r.status !== 'OK' ? 'dim' : '') + '"><span class="fact-label">' + iconFor(k) + esc(LABELS[k]) + '</span>' +
            '<span class="fact-value num">' + esc(shown(k)) + '</span></div>';
        }).join('') + '</div></section>',
      strip: null,
      groups: (flags.length ? [{ title: head, tone: 'good', says: '이 항목은 인수 기록에 있습니다.', lines: flags }] : [])
        .concat([{ title: word + ' 때 상태', lines: [rest.map(function (k) { return LABELS[k] + ' ' + shown(k); }).join(' · ')] }]),
      codeNotes: CODE_FULL.concat('반납 리포트의 근거에도 이 코드가 ' + word + ' 코드로 남습니다.'),
      proof: [['기록 번호', json.recordNo], ['차량', vehicleOf(json.vehicleId), vehicleNote(json)], [word, fullStamp(json.capturedAt)], ['적용 기준', json.rules || '-']]
    };
  }

  // 복사: 클립보드 API → 예전 방식 순서로 해 보고, 둘 다 안 되면 false
  function copyText(text) {
    function legacy() {
      var area = document.createElement('textarea');
      area.value = text;
      area.setAttribute('readonly', '');
      area.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
      document.body.appendChild(area);
      area.select();
      area.setSelectionRange(0, text.length);
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(area);
      return ok;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(function () { return true; }, legacy);
    return Promise.resolve(legacy());
  }
  // 복사한 뒤 버튼을 잠깐 '복사했습니다'로 바꾼다.
  function flash(button) {
    var label = button.querySelector('span'), use = button.querySelector('use');
    if (!button.dataset.label) { button.dataset.label = label.textContent; button.dataset.icon = use.getAttribute('href'); }
    label.textContent = '복사했습니다';
    use.setAttribute('href', '#i-check');
    clearTimeout(button.timer);
    button.timer = setTimeout(function () {
      label.textContent = button.dataset.label;
      use.setAttribute('href', button.dataset.icon);
    }, 2500);
  }
  function say(el, text, miss) { el.textContent = text; el.classList.toggle('miss', !!miss); }
  function copyInto(button, done, manual, text, ok) {
    return copyText(text).then(function (copied) {
      manual.hidden = copied;
      if (copied) {
        say(done, ok);
        flash(button);
      } else {
        say(done, '자동으로 복사하지 못했습니다. 아래 글을 길게 눌러 복사하세요.', true);
        manual.value = text;
        manual.focus();
        manual.select();
        manual.scrollTop = 0;
      }
    });
  }

  // 요약 이미지. 외부 라이브러리 없이 canvas에 글자를 직접 그린다. 업체에 보낼 수도 있어 테마와 상관없이 낮 색을 쓴다.
  var DAY = { paper: '#F2F4F5', rule: '#D5DBDE', ink: '#14191C', ink2: '#55616A', warn: '#A4570F', good: '#1E7A4C', NEEDS_CHECK: '#EC9846', SHIELD: '#1E7A4C', NOTE: '#55616A', UNCHANGED: '#BAC2C7', UNKNOWN: '#8B969D' };
  var FACE = '"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif';
  function imageBlocks(m) {
    var out = [];
    function line(text, size, weight, color, before) { out.push({ text: text, size: size, weight: weight, color: color, before: before }); }
    line('차곡 ' + m.doc + (m.mark ? ' · ' + m.mark : ''), 14, 700, DAY.ink2, 0);
    m.lead.forEach(function (l, i) { line(bare(l.text), 24, 700, l.warn ? DAY.warn : DAY.ink, i ? 0 : 12); });
    if (m.basis) line(m.basis, 13, 400, DAY.ink2, 4);
    if (m.strip && m.strip.length) out.push({ strip: m.strip, before: 16 });
    m.groups.forEach(function (g) {
      line(g.title, 15, 700, g.tone === 'warn' ? DAY.warn : g.tone === 'good' ? DAY.good : DAY.ink2, 18);
      if (g.says) line(g.says, 13, 400, DAY.good, 1);
      g.lines.forEach(function (text) { line(text, 14, 400, DAY.ink, 3); });
    });
    out.push({ rule: true, before: 20 });
    line('기록 번호 ' + m.no + ' · 차량 ' + m.vehicle, 13, 400, DAY.ink2, 14);
    line(m.period + ' (서울 시간)', 13, 400, DAY.ink2, 0);
    line('무결성 값 ' + m.code, 17, 700, DAY.ink, 8);
    line(CODE_IMAGE, 12, 400, DAY.ink2, 2);
    if (m.disclaimer) line(DISCLAIMER, 12, 400, DAY.ink2, 6);
    line(m.summary ? '이 이미지는 요약입니다. 전체 기록은 차에 보관됩니다.' : '이 이미지는 요약입니다. 원본 기록은 차곡 링크에 있습니다.', 12, 400, DAY.ink2, 6);
    return out;
  }
  function wrap(pen, text, width) {
    var lines = [], line = '';
    String(text).split(' ').forEach(function (word) {
      var next = line ? line + ' ' + word : word;
      if (pen.measureText(next).width <= width) { line = next; return; }
      if (line) lines.push(line);
      while (pen.measureText(word).width > width) {
        var n = word.length;
        while (n > 1 && pen.measureText(word.slice(0, n)).width > width) n--;
        lines.push(word.slice(0, n));
        word = word.slice(n);
      }
      line = word;
    });
    if (line) lines.push(line);
    return lines;
  }
  function drawImage(m) {
    var W = 390, PAD = 24, SCALE = 3;
    var canvas = document.createElement('canvas'), pen = canvas.getContext('2d');
    var blocks = imageBlocks(m), y = PAD;
    function face(b) { return b.weight + ' ' + b.size + 'px ' + FACE; }
    blocks.forEach(function (b) {
      y += b.before || 0;
      b.y = y;
      if (b.rule) { y += 1; return; }
      if (b.strip) { y += 14; return; }
      pen.font = face(b);
      b.lines = wrap(pen, b.text, W - PAD * 2);
      b.height = Math.round(b.size * 1.5);
      y += b.lines.length * b.height;
    });
    var H = y + PAD;
    canvas.width = W * SCALE;
    canvas.height = H * SCALE;
    pen.scale(SCALE, SCALE);
    pen.fillStyle = DAY.paper;
    pen.fillRect(0, 0, W, H);
    pen.textBaseline = 'middle';
    blocks.forEach(function (b) {
      if (b.rule) { pen.fillStyle = DAY.rule; pen.fillRect(PAD, b.y, W - PAD * 2, 1); return; }
      if (b.strip) {
        var gap = 3, cell = (W - PAD * 2 - gap * (b.strip.length - 1)) / b.strip.length;
        b.strip.forEach(function (v, i) {
          var x = PAD + i * (cell + gap);
          if (v === 'NOTE' || v === 'UNKNOWN') {
            pen.strokeStyle = DAY[v];
            pen.lineWidth = 2;
            pen.setLineDash(v === 'UNKNOWN' ? [3, 2] : []);
            pen.strokeRect(x + 1, b.y + 1, cell - 2, 12);
          } else {
            pen.fillStyle = DAY[v];
            pen.fillRect(x, b.y, cell, 14);
          }
        });
        return;
      }
      pen.font = face(b);
      pen.fillStyle = b.color;
      b.lines.forEach(function (text, i) { pen.fillText(text, PAD, b.y + b.height * (i + 0.5)); });
    });
    return canvas;
  }
  function isApplePhone() { return /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }

  function bindActions(m) {
    var link = location.href;
    var keep = document.getElementById('keep'), keepDone = document.getElementById('keep-done'), keepManual = document.getElementById('keep-manual');
    var copyButton = document.getElementById('copy-text'), copyLink = document.getElementById('copy-link'), save = document.getElementById('save-image');
    var KEPT = '링크를 복사했습니다. 메모나 나에게 보내기에 붙여 넣어 보관하세요.';

    copyButton.addEventListener('click', function () {
      copyInto(copyButton, document.getElementById('copy-text-done'), document.getElementById('copy-text-manual'), message(m) + ' 링크: ' + link, '문구를 복사했습니다. 답장 칸에 붙여 넣으세요.');
    });
    keep.addEventListener('click', function () {
      if (!navigator.share) { copyInto(keep, keepDone, keepManual, link, KEPT); return; }
      navigator.share({ title: document.title, text: '차곡 ' + m.doc + ' ' + m.no, url: link }).then(function () {
        say(keepDone, '공유했습니다. 보낸 곳에서 이 링크를 열면 같은 기록이 나옵니다.');
      }, function (e) {
        if (!e || e.name !== 'AbortError') copyInto(keep, keepDone, keepManual, link, KEPT);
      });
    });
    if (copyLink) copyLink.addEventListener('click', function () { copyInto(copyLink, keepDone, keepManual, link, KEPT); });

    save.addEventListener('click', function () {
      var label = save.querySelector('span'), idle = label.textContent;
      function finish(text, miss) { save.disabled = false; label.textContent = idle; say(keepDone, text, miss); }
      save.disabled = true;
      label.textContent = '만드는 중…';
      try {
        drawImage(m).toBlob(function (blob) {
          if (!blob) { finish('이미지를 만들지 못했습니다. 화면을 캡처해 보관하세요.', true); return; }
          var name = 'chagok-' + String(m.no).replace(/[^\w-]/g, '') + '.png';
          var url = URL.createObjectURL(blob);
          var shot = document.getElementById('shot'), image = document.getElementById('shot-image');
          if (image.src) URL.revokeObjectURL(image.src);
          image.src = url;
          shot.hidden = false;
          var file = isApplePhone() && navigator.canShare && typeof File === 'function' ? new File([blob], name, { type: 'image/png' }) : null;
          if (file && navigator.canShare({ files: [file] })) {
            // 아이폰은 공유 시트의 '이미지 저장'이 사진 앱으로 가는 길이다.
            navigator.share({ files: [file], title: document.title }).then(function () { finish('공유 창을 닫았습니다. \'이미지 저장\'을 골랐다면 사진 앱에 있습니다.'); }, function () { finish('아래 이미지를 길게 눌러 저장하세요.', true); });
            return;
          }
          var a = document.createElement('a');
          a.href = url;
          a.download = name;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          finish('이미지 내려받기를 시작했습니다. 내려받은 파일 목록을 확인하세요.');
        }, 'image/png');
      } catch (e) {
        finish('이미지를 만들지 못했습니다. 화면을 캡처해 보관하세요.', true);
      }
    });
  }

  // 업체용 반납 목록(../ops/)으로 가는 조용한 길. 고객 행동과 섞이지 않게 맨 아래에 글자 버튼으로만 둔다.
  function opsUrl() {
    var path = String(location.pathname || '');
    return /\/r(\/(index\.html)?)?$/.test(path) ? path.replace(/\/r(\/(index\.html)?)?$/, '/ops/') : '../ops/';
  }
  function ledgerAction(sample) {
    if (sample) return '<section class="ops"><a class="ops-add" href="' + esc(opsUrl()) + '">반납 목록으로 돌아가기</a></section>';
    return '<section class="ops"><button type="button" class="ops-add" id="ops-add"><span>업체 직원이신가요? 이 기록을 반납 목록에 추가</span></button>' +
      '<p class="ops-hint">고객은 누르지 않아도 됩니다. 목록은 이 휴대폰에만 저장되고 어디로도 보내지지 않습니다.</p>' +
      '<p class="done" id="ops-done" role="status"></p></section>';
  }
  // 저장 공간을 못 쓰면 던진다. 부르는 쪽에서 잡는다.
  function ledgerItems() {
    var raw = window.localStorage.getItem(LEDGER_KEY);
    if (!raw) return [];
    var data = JSON.parse(raw);
    if (!data || !Array.isArray(data.items)) throw new SyntaxError('ledger');
    return data.items;
  }
  function bindLedger(key, code) {
    var add = document.getElementById('ops-add');
    if (!add) return;
    function has(items) { return items.some(function (i) { return i && i.key === key; }); }
    var leaving = false;
    function open(word) { leaving = true; location.assign(opsUrl() + '#' + word + '=' + key.replace('sha256:', '').slice(0, 16)); }
    // 처음 열 때와 뒤로 가기로 돌아올 때 버튼 글을 맞춘다.
    function refresh() {
      leaving = false;
      try { if (has(ledgerItems())) add.querySelector('span').textContent = '이 기록은 반납 목록에 있습니다. 목록 열기'; } catch (e) { /* 누를 때 알린다 */ }
    }
    refresh();
    window.addEventListener('pageshow', refresh);
    add.addEventListener('click', function () {
      if (leaving) return;
      try {
        var items = ledgerItems();
        if (has(items)) return open('exists');
        items.push({ key: key, code: code, addedAt: new Date().toISOString() });
        var raw = JSON.stringify({ v: 1, items: items });
        window.localStorage.setItem(LEDGER_KEY, raw);
        if (window.localStorage.getItem(LEDGER_KEY) !== raw) throw new Error('not saved');
        open('added');
      } catch (e) {
        // 저장된 목록이 깨졌으면 목록 페이지가 그 사실을 알리고 정리할 길을 준다.
        if (e && e.name === 'SyntaxError') return location.assign(opsUrl());
        say(document.getElementById('ops-done'), '이 브라우저에 저장하지 못했습니다. 시크릿 모드이거나 사이트 데이터가 막혀 있을 수 있습니다. 일반 창에서 이 링크를 다시 열어 주세요.', true);
      }
    });
  }

  var match = /[#&]d=([0-9]+)\.([A-Za-z0-9_-]+)/.exec(location.hash);
  if (!match) return fail('기록이 담긴 링크가 아닙니다. 보관해 둔 링크를 끝까지 그대로 열어 주세요. 차 화면에 QR이 보이지 않으면 업체 직원에게 요청하세요.');
  if (match[1] !== '1') return fail('이 페이지가 모르는 기록 형식입니다. 페이지를 새로 고침한 뒤 다시 열어 주세요.');
  if (typeof DecompressionStream === 'undefined' || !window.crypto || !crypto.subtle) return fail('이 브라우저에서는 기록을 열 수 없습니다. Chrome이나 Safari 최신 버전으로 열어 주세요.');

  var text;
  inflate(bytes(match[2])).then(function (t) { text = t; return sha256(t); }).then(function (hash) {
    var json = JSON.parse(text);
    var model;
    if (json.schema === 'snapshot/1') model = snapshotModel(json, hash);
    else if (/^report(-summary)?\/[12]$/.test(json.schema)) model = reportModel(json, hash);
    else return fail('이 페이지가 모르는 기록 형식입니다. 페이지를 새로 고침한 뒤 다시 열어 주세요.');
    if (model.mark) document.getElementById('demo').innerHTML = '<span class="tag">' + esc(model.mark) + '</span>';
    document.getElementById('doc').textContent = model.doc;
    // 인수 기록은 반납이 아니므로 반납 목록에 넣지 않는다.
    var isReport = json.schema !== 'snapshot/1';
    view.innerHTML = (json.sample ? '<div class="state">' + icon('info') + '<p>시연용 예시입니다. 실제 차량에서 나온 기록이 아닙니다.</p></div>' : '') +
      hero(model) + actions(model) + model.details + proof(model) + (isReport ? ledgerAction(!!json.sample) : '');
    document.title = '차곡 · ' + json.recordNo;
    bindActions(model);
    // 업체용 버튼에 문제가 생겨도 이미 그린 고객 기록을 가리지 않는다.
    if (isReport && !json.sample) { try { bindLedger(json.reportHash || hash, match[1] + '.' + match[2]); } catch (e) { /* 버튼만 동작하지 않는다 */ } }
  }).catch(function () { fail('기록을 풀지 못했습니다. 링크가 잘렸을 수 있습니다. 보관해 둔 링크를 끝까지 복사해 다시 열어 주세요. 차 화면에 QR이 보이지 않으면 업체 직원에게 요청하세요.'); });
})();
</script>
</body>
</html>
