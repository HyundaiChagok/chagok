<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>차곡 기록</title>
<style>
/*
  고객 리포트 웹(기능 정의서 M-01). 데이터는 링크의 # 뒤에만 있고 서버로 가지 않는다. 외부 스크립트·글꼴을 쓰지 않는다.
  색과 구성은 차 화면(app/ui/Theme.kt)과 같다. 주황은 '확인 필요'에만 쓴다.
*/
:root{
  --paper:#F2F4F5;--raised:#FFFFFF;--sunken:#E5E9EB;--rule:#D5DBDE;
  --ink:#14191C;--ink-2:#55616A;--ink-3:#8B969D;
  --signal:#EC9846;--on-signal:#1C1206;--signal-ink:#A4570F;--signal-soft:#FCEAD6;
  --good:#1E7A4C;--good-soft:#DCF0E4;--bad:#B3261E;--bad-soft:#F9DEDC;
  --shadow:0 6px 24px rgba(0,0,0,.08);
  --sans:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","Roboto Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121719;--raised:#1B2225;--sunken:#20292D;--rule:#2C353B;
    --ink:#E3E7E9;--ink-2:#9BA6AE;--ink-3:#66727A;
    --signal-ink:#EFA35C;--signal-soft:#3A2919;--good:#74CFA0;--good-soft:#173226;--bad:#F2B8B5;--bad-soft:#3D2020;
    --shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121719;--raised:#1B2225;--sunken:#20292D;--rule:#2C353B;
  --ink:#E3E7E9;--ink-2:#9BA6AE;--ink-3:#66727A;
  --signal-ink:#EFA35C;--signal-soft:#3A2919;--good:#74CFA0;--good-soft:#173226;--bad:#F2B8B5;--bad-soft:#3D2020;
  --shadow:none;color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
::selection{background:var(--signal-soft);color:var(--ink)}
:focus-visible{outline:3px solid var(--signal);outline-offset:3px;border-radius:6px}
main{max-width:40rem;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.num{font-variant-numeric:tabular-nums}
.ic{width:24px;height:24px;flex:none;fill:currentColor}

.top{display:flex;align-items:center;justify-content:space-between;min-height:48px}
.brand{font-weight:700;font-size:1.25rem;color:var(--signal-ink);letter-spacing:.02em}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.8125rem;font-weight:600;line-height:1;padding:7px 10px;border-radius:8px;background:var(--signal-soft);color:var(--signal-ink)}

h1{font-size:1.75rem;line-height:1.3;margin:16px 0 4px;letter-spacing:-.01em;text-wrap:balance}
.meta{margin:0;color:var(--ink-2);font-size:.9375rem}
.meta b{font-weight:600;color:var(--ink)}

/* 무결성 값: 차 화면과 맞춰 보는 기준이라 페이지에서 가장 단단한 면에 둔다. */
.seal{margin:24px 0 8px;padding:20px;border-radius:20px;background:var(--raised);box-shadow:var(--shadow);border:1px solid var(--rule)}
.seal-head{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:.875rem;font-weight:600}
.seal-value{display:block;font-family:var(--mono);font-size:2rem;line-height:1.2;letter-spacing:.06em;margin:6px 0 4px}
.seal p{margin:0;color:var(--ink-2);font-size:.875rem}
.keep{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;margin-top:16px;border:0;border-radius:999px;background:var(--signal);color:var(--on-signal);font:inherit;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .12s ease-out,filter .12s ease-out}
.keep:active{transform:scale(.97);filter:brightness(.95)}
.keep .ic{width:22px;height:22px}
.keep-done{display:none;margin-top:10px;color:var(--good);font-size:.875rem;font-weight:600;text-align:center}
.keep-done.on{display:block}

/* 13칸 막대: 칸 하나가 확인한 항목 하나다. 꽉 찬 칸은 확인 필요·변화 없음, 테두리 칸은 참고·확인 불가. */
.strip{display:flex;gap:4px;margin:28px 0 12px}
.strip span{flex:1;height:20px;border-radius:5px}
.v-NEEDS_CHECK{background:var(--signal)}
.v-NOTE{border:2.5px solid var(--signal)}
.v-UNCHANGED{background:var(--ink-3);background:color-mix(in srgb,var(--ink-2) 35%,transparent)}
.v-UNKNOWN{border:2.5px solid var(--ink-3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 20px;margin:0;padding:0;list-style:none;font-size:.9375rem;color:var(--ink-2)}
.legend li{display:flex;align-items:center;gap:8px}
.legend i{width:14px;height:14px;border-radius:4px;flex:none}
.legend b{color:var(--ink);font-size:1.125rem}
.note{display:flex;gap:8px;margin:16px 0 0;color:var(--ink-2);font-size:.875rem}
.note .ic{width:20px;height:20px;margin-top:2px}

section{margin-top:32px}
h2{display:flex;align-items:baseline;gap:8px;font-size:1.0625rem;margin:0 0 4px;color:var(--ink-2)}
h2.warn{color:var(--signal-ink)}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--rule)}
.badge{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--sunken);color:var(--ink-2)}
.warn .badge{background:var(--signal-soft);color:var(--signal-ink)}
.badge .ic{width:22px;height:22px}
.text{flex:1;min-width:0}
.text strong{display:block;font-weight:600;font-size:1rem;line-height:1.45;margin-top:8px}
.text span{display:block;color:var(--ink-2);font-size:.9375rem}
.dim .text strong{color:var(--ink-2);font-weight:500}
.values{display:flex;justify-content:space-between;gap:12px;margin-top:6px;color:var(--ink-2);font-size:.875rem}
.values b{color:var(--ink);font-weight:600}
.bar{position:relative;height:10px;margin:8px 0 4px;border-radius:5px;background:var(--sunken)}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px 0 0 5px;background:var(--ink-2)}
.bar b{position:absolute;top:0;bottom:0;background:var(--signal)}
.bar u{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0;padding:0;list-style:none}
.chips li{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:10px;background:var(--sunken);color:var(--ink-2);font-size:.9375rem}
.chips .ic{width:18px;height:18px}

/* 인수 기록: 값이 주인공이라 칸 위에 선을 둔 표로 보인다. */
.facts{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;margin-top:28px}
.fact{border-top:1px solid var(--rule);padding:14px 0 18px}
.fact.warn{border-top:2px solid var(--signal)}
.fact-label{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:.875rem}
.fact-label .ic{width:18px;height:18px}
.fact-value{display:block;font-size:1.25rem;font-weight:600;margin-top:4px}
.fact.warn .fact-value,.fact.warn .fact-label{color:var(--signal-ink)}
.fact.dim .fact-value{color:var(--ink-2);font-weight:500;font-size:1rem}

.state{display:flex;gap:12px;align-items:flex-start;margin-top:24px;padding:16px;border-radius:16px;background:var(--sunken);color:var(--ink-2)}
.state.error{background:var(--bad-soft);color:var(--bad)}
.state p{margin:0}
footer{display:flex;gap:8px;margin-top:40px;color:var(--ink-2);font-size:.8125rem}
footer .ic{width:18px;height:18px;margin-top:2px}
@media (prefers-reduced-motion: reduce){.keep{transition:none}}
</style>
</head>

    var facts = Object.keys(LABELS).filter(function (k) { return json.readings[k] && json.readings[k].status !== 'UNSUPPORTED'; }).map(function (k) {
      var r = json.readings[k];
      var cls = r.status !== 'OK' ? 'dim' : attention(k, r) ? 'warn' : '';
      return '<div class="fact ' + cls + '"><span class="fact-label">' + iconFor(k) + esc(LABELS[k]) + '</span>' +
        '<span class="fact-value num">' + esc(reading(k, r)) + '</span></div>';
    }).join('');
    view.innerHTML =
      heading((json.kind === 'RETURN' ? '반납' : '인수') + ' 기록', '기록 번호 <b class="num">' + esc(json.recordNo) + '</b> · 차량 ' + esc(json.vehicleId), time(json.capturedAt)) +
      seal(hash, '차 화면에 보이는 값과 같으면 같은 기록입니다.') +
      '<div class="facts">' + facts + '</div>';
  }

  function rowItem(r, tone) {
    var lines = r.verdict === 'UNKNOWN' ? [r.label + ' · ' + r.notes.join(', ')] : r.notes;
    var before = percent(r.before), after = percent(r.after);
    var energy = (r.item === 'fuelPercent' || r.item === 'evSocPercent') && after !== null;
    var extra = '';
    if (energy) {
      var drop = before !== null && before > after ? before - after : 0;
      extra = '<div class="values num"><span>인수 <b>' + esc(r.before || '-') + '</b></span><span>반납 <b>' + esc(r.after) + '</b></span></div>' +
        '<div class="bar" role="img" aria-label="인수 ' + esc(r.before || '-') + ', 반납 ' + esc(r.after) + '">' +
        '<i style="width:' + after + '%"></i>' + (drop ? '<b style="left:' + after + '%;width:' + drop + '%"></b><u style="left:' + before + '%"></u>' : '') + '</div>';
    }
    return '<li class="' + tone + '"><span class="badge">' + iconFor(r.item) + '</span><div class="text">' +
      '<strong>' + esc(lines[0] || r.label) + '</strong>' +
      lines.slice(1).map(function (n) { return '<span>' + esc(n) + '</span>'; }).join('') + extra + '</div></li>';
  }

  function renderReport(json, hash) {
    var summary = /^report-summary\//.test(json.schema);
    var rows = (json.rows || []).map(function (r) { return Object.assign({ label: nameOf(r.item) }, r); });
    var c = json.counts || {};
    var strip = ORDER.map(function (v) { return new Array((c[v] || 0) + 1).join('<span class="v-' + v + '"></span>'); }).join('');
    var legend = ORDER.map(function (v) {
      return '<li><i class="v-' + v + '"></i>' + VERDICTS[v] + ' <b class="num">' + (c[v] || 0) + '</b></li>';
    }).join('');
    function section(v) {
      var group = rows.filter(function (r) { return r.verdict === v; });
      if (!group.length) return '';
      var tone = v === 'NEEDS_CHECK' ? 'warn' : v === 'UNKNOWN' ? 'dim' : '';
      return '<section><h2 class="' + (v === 'NEEDS_CHECK' ? 'warn' : '') + '">' + VERDICTS[v] + ' <span class="num">' + group.length + '</span></h2>' +
        '<ul class="rows">' + group.map(function (r) { return rowItem(r, tone); }).join('') + '</ul></section>';
    }
    // 요약본(report-summary/1)은 변화 없는 항목을 이름만 담는다.
    function unchanged() {
      // 요약본 v1은 이름, v2는 항목 키를 담는다.
      var list = summary ? (json.unchanged || []).map(function (x) { return NAMES[x] ? { item: x, label: NAMES[x] } : { label: x }; })
        : rows.filter(function (r) { return r.verdict === 'UNCHANGED'; });
      if (!list.length) return '';
      return '<section><h2>변화 없음 <span class="num">' + list.length + '</span></h2><ul class="chips">' +
        list.map(function (r) { return '<li>' + (r.item ? iconFor(r.item) : '') + esc(r.label) + '</li>'; }).join('') + '</ul></section>';
    }
    // 차 화면과 같은 순서: 확인 필요 → 참고 → 변화 없음 → 확인 불가
    var sections = section('NEEDS_CHECK') + section('NOTE') + unchanged() + section('UNKNOWN');
    var period = sameDay(json.pickup.at, json['return'].at) ? time(json.pickup.at) + ' → ' + clock(json['return'].at) : time(json.pickup.at) + ' → ' + time(json['return'].at);
    view.innerHTML =
      heading('반납 리포트', '기록 번호 <b class="num">' + esc(json.recordNo) + '</b> · 차량 ' + esc(json.vehicleId), period) +
      seal(summary ? json.reportHash : hash, summary ? '요약본입니다. 값은 원본 리포트의 무결성 값입니다.' : '차 화면에 보이는 값과 같으면 같은 기록입니다.') +
      '<div class="strip" aria-hidden="true">' + strip + '</div><ul class="legend">' + legend + '</ul>' +
      '<p class="note">' + icon('info') + '<span>' + esc(DISCLAIMER) + '</span></p>' +
      sections;
  }

  // 나중에 다시 열 수 있게 링크(기록이 # 뒤에 들어 있다)를 공유하거나 복사한다.
  function bindKeep() {
    var button = document.getElementById('keep'), done = document.getElementById('keep-done');
    if (!button) return;
    button.addEventListener('click', function () {
      var url = location.href;
      if (navigator.share) {
        navigator.share({ title: document.title, url: url }).catch(function () {});
      } else if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function () {
          done.textContent = '링크를 복사했습니다. 메모나 메신저에 붙여 넣어 보관하세요.';
          done.classList.add('on');
        }, function () { window.prompt('이 링크를 복사해 보관하세요.', url); });
      } else {
        window.prompt('이 링크를 복사해 보관하세요.', url);
      }
    });
  }

  var match = /[#&]d=([0-9]+)\.([A-Za-z0-9_-]+)/.exec(location.hash);
  if (!match) return fail('기록이 담긴 링크가 아닙니다. 차 화면의 QR을 다시 찍어 주세요.');
  if (match[1] !== '1') return fail('이 페이지가 모르는 기록 형식입니다.');
  if (typeof DecompressionStream === 'undefined' || !window.crypto || !crypto.subtle) return fail('이 브라우저에서는 기록을 열 수 없습니다. 최신 브라우저로 열어 주세요.');

  var text;
  inflate(bytes(match[2])).then(function (t) { text = t; return sha256(t); }).then(function (hash) {
    var json = JSON.parse(text);
    if (json.demo) document.getElementById('demo').innerHTML = '<span class="tag">시연 모드</span>';
    if (json.schema === 'snapshot/1') renderSnapshot(json, hash);
    else if (/^report(-summary)?\/[12]$/.test(json.schema)) renderReport(json, hash);
    else return fail('이 페이지가 모르는 기록 형식입니다.');
    document.title = '차곡 · ' + json.recordNo;
    bindKeep();
  }).catch(function () { fail('기록을 풀지 못했습니다. 링크가 잘렸을 수 있습니다. QR을 다시 찍어 주세요.'); });
})();
</script>
</body>
</html>
